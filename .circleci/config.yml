version: 2.1
orbs:
  codecov: codecov/codecov@6.1.0
workflows:
  version: 2
  lint:
    jobs:
      - flake8
  test:
    jobs:
      - test-311
      - test-312
      - test-313
      - test-314
      - test-315
  docs:
    jobs:
      - docs
jobs:
  test-311: &test-template
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          key: dependencies-{{ .Environment.CACHE_VERSION }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Install Dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -e .[dev,ehm,optuna,roadnet,shapely] opencv-python-headless
      - save_cache:
          paths:
            - ./venv
          key: dependencies-{{ .Environment.CACHE_VERSION }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Run Tests
          command: |
            . venv/bin/activate
            mkdir test-reports
            pytest --junitxml=test-reports/junit.xml --cov --cov-report=xml:test-reports/coverage.xml --slow stonesoup
      - store_test_results:
          path: test-reports/junit.xml
      - store_artifacts:
          path: test-reports
      - codecov/upload:
          files: test-reports/coverage.xml
          flags: unittests
  test-312:
    <<: *test-template
    docker:
      - image: cimg/python:3.12
  test-313:
    <<: *test-template
    docker:
      - image: cimg/python:3.13
  test-314:
    <<: *test-template
    docker:
      - image: cimg/python:3.14
  test-315:
    docker:
      - image: cimg/python:3.15
    steps:
      - checkout
      - restore_cache:
          key: dependencies-{{ .Environment.CACHE_VERSION }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Install Dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -e .[ehm,optuna,roadnet,shapely] opencv-python-headless opencv-python-headless plotly pytest-cov pytest-remotedata pytest-skip-slow pandas graphviz networkx pydot cbor2
      - save_cache:
          paths:
            - ./venv
          key: dependencies-{{ .Environment.CACHE_VERSION }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Run Tests
          command: |
            . venv/bin/activate
            mkdir test-reports
            pytest --junitxml=test-reports/junit.xml --cov --cov-report=xml:test-reports/coverage.xml --slow stonesoup
      - store_test_results:
          path: test-reports/junit.xml
      - store_artifacts:
          path: test-reports
      - codecov/upload:
          files: test-reports/coverage.xml
          flags: unittests
  flake8:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - restore_cache:
          key: dependencies-flake8-{{ .Environment.CACHE_VERSION }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Install Dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install flake8
      - save_cache:
          paths:
            - ./venv
          key: dependencies-flake8-{{ .Environment.CACHE_VERSION }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Flake8
          command: |
            . venv/bin/activate
            flake8 --tee --output-file test-reports stonesoup
      - store_artifacts:
          path: test-reports
  docs:
    resource_class: medium
    docker:
      - image: cimg/python:3.14-browsers
    steps:
      - checkout
      - restore_cache:
          key: dependencies-doc-{{ .Environment.CACHE_VERSION }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Install OS Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y graphviz
      - run:
          name: Install Dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r docs/ci-requirements.txt
            pip install -e .[dev,docs] opencv-python-headless joblib
            kaleido_get_chrome
      - save_cache:
          paths:
            - ./venv
          key: dependencies-doc-{{ .Environment.CACHE_VERSION }}-{{ checksum "/home/circleci/.pyenv/version" }}-{{ checksum "pyproject.toml" }}
      - run:
          name: Build Docs
          environment:
            SPHINX_GALLERY_PARALLEL: 2
          command: |
            . venv/bin/activate
            python .circleci/install_coverage_subprocess_pth.py
            export COVERAGE_PROCESS_START="${PWD}/pyproject.toml"
            coverage run -m sphinx -b html -j ${SPHINX_GALLERY_PARALLEL} -d build/.doctrees -W --keep-going -D sphinx_gallery_conf.junit=../../../test-reports/sphinx-gallery/junit.xml docs/source docs/build/html
            coverage combine --quiet
            coverage xml -o test-reports/coverage.xml
      - store_artifacts:
          path: docs/build/html
          destination: docs
      - store_test_results:
          path: test-reports/sphinx-gallery/junit.xml
      - store_artifacts:
          path: test-reports
      - codecov/upload:
          files: test-reports/coverage.xml
          flags: integration
