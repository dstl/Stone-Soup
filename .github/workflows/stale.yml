name: 'Close stale issues'

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 30
          exempt-issue-labels: 'has open PR'
          # Pull requests are not marked stale or closed
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no
            activity in the last 90 days. It will be closed in 30 days if no further
            activity occurs. If this issue is still relevant, please leave a comment
            or remove the `stale` label.
          close-issue-message: >
            This issue has been automatically closed because it has had no activity
            in the 30 days since it was marked as stale. Please feel free to reopen it,
            or open a new issue, if it is still relevant.
